<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="A simple workspace for creating and managing reviews."
    >
    <title>Live Reviews</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" data-route aria-label="Live Reviews home">
        <span class="brand-mark" aria-hidden="true">LR</span>
        <span>Live Reviews</span>
      </a>
      <span class="header-note">A little space for thoughtful feedback</span>
    </header>

    <main class="page-shell" id="app">
      <p class="loading-message">Loading reviews...</p>
    </main>

    <footer class="site-footer">
      <span>Live Reviews</span>
      <span>Thoughtful feedback, kept together.</span>
    </footer>
  </body>
</html>
