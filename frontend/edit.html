<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit a review | Live Reviews</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./edit.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./index.html" aria-label="Live Reviews home">
        <span class="brand-mark" aria-hidden="true">LR</span>
        <span>Live Reviews</span>
      </a>
      <span class="header-note">A little space for thoughtful feedback</span>
    </header>

    <main class="page-shell">
      <section class="page-heading">
        <div>
          <p class="eyebrow">Review details</p>
          <h1>Edit your review.</h1>
          <p class="page-description">Keep the details up to date.</p>
        </div>
      </section>

      <section class="form-card">
        <form class="form-content" id="review-form">
          <p class="form-intro">
            Make any changes you need, then save your updated review.
          </p>
          <div class="form-field">
            <label for="review-title">Title</label>
            <input
              id="review-title"
              name="title"
              type="text"
              placeholder="Give your review a clear title"
              autocomplete="off"
              required
            >
          </div>
          <div class="form-field">
            <label for="review-content">Content</label>
            <textarea
              id="review-content"
              name="content"
              placeholder="What would you like to share?"
              required
            ></textarea>
          </div>
          <p class="form-error" id="status-message" role="alert" hidden></p>
          <div class="form-actions">
            <button class="button button-danger" id="delete-review" type="button">
              Delete review
            </button>
            <div class="form-actions-main">
              <a class="button button-secondary" href="./index.html">Cancel</a>
              <button class="button button-secondary" type="reset">Reset</button>
              <button class="button button-primary" type="submit">Save review</button>
            </div>
          </div>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <span>Live Reviews</span>
      <span>Thoughtful feedback, kept together.</span>
    </footer>
  </body>
</html>
